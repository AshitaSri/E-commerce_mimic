name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build frontend
        run: npm run build -w frontend

      - name: Syntax-check backend services
        run: |
          for f in services/*/index.js shared/*.js; do
            echo "Checking $f"
            node --check "$f"
          done
